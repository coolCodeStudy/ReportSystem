<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语言教学安排配置 - 后台配置中心</title>
    <!-- Bootstrap CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom Styles -->
    <link href="/css/style.css" rel="stylesheet">
    <style>
        .table-responsive { max-height: 60vh; overflow-y: auto; }
        .sticky-header th { position: sticky; top: 0; background-color: #f8f9fa; z-index: 1; }
        .pre-wrap { white-space: pre-wrap; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <img src="/images/lingoland_logo.jpg" alt="Lingoland Logo">
                <span style="font-size: 1.1rem; letter-spacing: 0.5px;">语陆教育 | 后台配置中心</span>
            </div>
            <div class="header-actions">
                <a href="/" class="btn btn-outline-primary btn-sm"><i class="bi bi-box-arrow-left"></i> 返回教务主页</a>
            </div>
        </header>

        <div class="app-body">
            <!-- Sidebar -->
            <aside class="app-sidebar">
                <div class="sidebar-section">
                    <h6 class="sidebar-heading">教务管理</h6>
                    <ul class="nav flex-column sidebar-nav">
                        <li class="nav-item">
                            <a class="nav-link text-secondary" href="/"><i class="bi bi-arrow-left"></i> 返回档案主页</a>
                        </li>
                    </ul>
                </div>
                
                <div class="sidebar-section border-0">
                    <h6 class="sidebar-heading">系统及设置</h6>
                    <ul class="nav flex-column sidebar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="/admin/templates">
                                <i class="bi bi-gear-wide-connected"></i> 测评报告配置
                            </a>
                        </li>
                        <li class="nav-item mt-1">
                            <a class="nav-link" href="/admin/analysis-templates">
                                <i class="bi bi-bar-chart-steps"></i> 测评分析模板配置
                            </a>
                        </li>
                        <li class="nav-item mt-1">
                            <a class="nav-link active" href="/admin/teaching-plan">
                                <i class="bi bi-book"></i> 语言教学安排配置
                            </a>
                        </li>
                    </ul>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="app-main">
                <div class="main-header mb-4">
                     <h4 class="fw-bold mb-1">语言教学安排配置</h4>
                     <p class="text-muted">集中管理教材（如 NEF）的各单元教学大纲，提供结构化导入能力。</p>
                </div>

                <div class="row">
                    <div class="col-12">
                        <div class="card shadow-sm border-0 mb-4">
                            <div class="card-body p-4 bg-light">
                                <div class="alert alert-info py-2 small mb-3">
                                    <strong>注意：</strong> 上传新的 <code>.xlsx</code> 文件会自动覆盖/更新相同单元编号的数据。表头必须紧接包含这几项内容，第二行起会被识别成大纲数据。<br/>
                                    所需列：【单元编号(必须在第1列)】【课程内容】【学习目标】【授课时长】
                                </div>
                                <div class="d-flex align-items-center gap-3">
                                    <input type="text" id="bookNameInput" class="form-control" placeholder="输入教材名称 (如: NEF)" style="max-width: 200px;">
                                    <input type="file" id="excelFile" class="form-control" accept=".xlsx" style="max-width: 300px;">
                                    <button class="btn btn-primary shadow-sm" onclick="uploadExcel()">
                                        <i class="bi bi-cloud-arrow-up-fill me-1"></i> 上传并导入
                                    </button>
                                    <button class="btn btn-outline-danger ms-auto shadow-sm" onclick="clearPlans()">
                                        <i class="bi bi-trash-fill me-1"></i> 清空所有数据
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="card shadow-sm border-0">
                            <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
                                <h6 class="mb-0 fw-bold text-secondary"><i class="bi bi-table me-2"></i> 已导入的教学计划大纲内容</h6>
                                <select id="bookSelector" class="form-select form-select-sm w-auto" onchange="renderTable()">
                                    <option value="">全部教材</option>
                                </select>
                            </div>
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-hover table-bordered mb-0">
                                        <thead class="sticky-header">
                                            <tr>
                                                <th width="12%">教材名称</th>
                                                <th width="12%">单元编号</th>
                                                <th width="28%">课程内容</th>
                                                <th width="35%">学习目标</th>
                                                <th width="13%">授课时长</th>
                                            </tr>
                                        </thead>
                                        <tbody id="planTableBody">
                                            <tr><td colspan="5" class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm me-2"></div>加载中...</td></tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let allPlans = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadPlans();
        });

        function loadPlans() {
            fetch('/admin/api/teaching-plan/list')
                .then(res => res.json())
                .then(res => {
                    if (res.code === 200 && res.data && res.data.length > 0) {
                        allPlans = res.data;
                        updateBookSelector();
                        renderTable();
                    } else {
                        allPlans = [];
                        updateBookSelector();
                        document.getElementById('planTableBody').innerHTML = '<tr><td colspan="5" class="text-center py-5 text-muted"><i class="bi bi-inbox fs-2 d-block mb-3"></i> 暂无教学计划大纲数据，请在上方导入Excel。</td></tr>';
                    }
                })
                .catch(() => {
                    allPlans = [];
                    document.getElementById('planTableBody').innerHTML = '<tr><td colspan="5" class="text-center py-4 text-danger">数据加载失败</td></tr>';
                });
        }

        function updateBookSelector() {
            const selector = document.getElementById('bookSelector');
            const currentSelected = selector.value;
            
            const books = [...new Set(allPlans.map(p => p.bookName))].filter(Boolean);
            
            let html = '<option value="">全部教材</option>';
            books.forEach(book => {
                const selected = book === currentSelected ? 'selected' : '';
                html += `<option value="${book}" ${selected}>${book}</option>`;
            });
            selector.innerHTML = html;
            
            if (currentSelected && !books.includes(currentSelected)) {
                selector.value = '';
            }
        }

        function renderTable() {
            const tbody = document.getElementById('planTableBody');
            tbody.innerHTML = '';
            
            const selectedBook = document.getElementById('bookSelector').value;
            const filteredPlans = selectedBook ? allPlans.filter(p => p.bookName === selectedBook) : allPlans;

            if (filteredPlans.length > 0) {
                filteredPlans.forEach(p => {
                    tbody.innerHTML += `
                        <tr>
                            <td class="align-middle fw-bold text-primary">${p.bookName || '-'}</td>
                            <td class="fw-bold align-middle"><code>${p.unitCode || '-'}</code></td>
                            <td class="pre-wrap align-middle text-muted">${p.courseContent || '-'}</td>
                            <td class="pre-wrap align-middle">${p.learningObjectives || '-'}</td>
                            <td class="pre-wrap align-middle text-info">${p.teachingDuration || '-'}</td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-5 text-muted"><i class="bi bi-inbox fs-2 d-block mb-3"></i> 没有找到相关的教学计划大纲数据</td></tr>';
            }
        }

        function uploadExcel() {
            const bookInput = document.getElementById('bookNameInput').value.trim();
            if (!bookInput) {
                alert('请填写教材名称！');
                return;
            }

            const fileInput = document.getElementById('excelFile');
            if (!fileInput.files.length) {
                alert('请先选择一个 .xlsx 文件！');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('bookName', bookInput);

            const btn = event.currentTarget;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> 导入中...';
            btn.disabled = true;

            fetch('/admin/api/teaching-plan/import', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(res => {
                btn.innerHTML = originalText;
                btn.disabled = false;
                if (res.code === 200) {
                    alert('导入成功！');
                    fileInput.value = '';
                    loadPlans();
                } else {
                    alert(res.message || '导入出错');
                }
            })
            .catch(err => {
                btn.innerHTML = originalText;
                btn.disabled = false;
                alert('网络或服务器出错: ' + err);
            });
        }

        function clearPlans() {
            if (confirm('警告：您确定要彻底清空所有教学安排数据吗？此操作不可逆！')) {
                fetch('/admin/api/teaching-plan/clear', { method: 'DELETE' })
                .then(res => res.json())
                .then(res => {
                    if (res.code === 200) {
                        alert('已清空所有数据！');
                        loadPlans();
                    }
                });
            }
        }
    </script>
</body>
</html>
