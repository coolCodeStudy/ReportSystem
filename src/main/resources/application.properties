# Application Configuration
spring.application.name=report-system

# Server Configuration
server.port=8080

# Thymeleaf Configuration
spring.thymeleaf.enabled=true
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/reportsystem
spring.datasource.username=reportuser
spring.datasource.password=reportpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server-side PDF export
report.pdf.enabled=${REPORT_PDF_ENABLED:false}
report.pdf.executable=${REPORT_PDF_EXECUTABLE:libreoffice}
report.pdf.timeout-seconds=${REPORT_PDF_TIMEOUT_SECONDS:120}
report.pdf.max-concurrent=${REPORT_PDF_MAX_CONCURRENT:1}
report.pdf.temp-root=${REPORT_PDF_TEMP_ROOT:${java.io.tmpdir}}
