name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: reportsystem
          POSTGRES_USER: reportuser
          POSTGRES_PASSWORD: reportpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run unit and integration tests
      run: |
        chmod +x gradlew
        ./gradlew test

    - name: Install Playwright dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r e2e/requirements.txt
        python -m playwright install --with-deps chromium

    - name: Start local app for Daily Gate
      run: |
        mkdir -p build/qa-gate
        nohup ./gradlew bootRun -PlocalPort=18080 > build/qa-gate/app.log 2>&1 &
        echo $! > build/qa-gate/app.pid
        for i in {1..60}; do
          if curl -fsS http://localhost:18080/ >/dev/null; then
            exit 0
          fi
          sleep 2
        done
        cat build/qa-gate/app.log
        exit 1

    - name: Run Daily Gate
      env:
        BASE_URL: http://localhost:18080
        TEMPLATE_SYNC_SOURCE_BASE_URL: http://121.41.236.44:8080
        QA_ARTIFACT_DIR: build/qa-gate
      run: |
        chmod +x scripts/qa_gate.sh scripts/monthly_bug_hunt.sh
        scripts/qa_gate.sh

    - name: Stop local app
      if: always()
      run: |
        if [ -f build/qa-gate/app.pid ]; then
          kill "$(cat build/qa-gate/app.pid)" || true
        fi

    - name: Upload QA artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: qa-gate
        path: build/qa-gate

    - name: Build deployable JAR
      run: |
        ./gradlew clean bootJar

    - name: Copy JAR to ECS via SCP
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.ECS_HOST }}
        username: ${{ secrets.ECS_USERNAME }}
        password: ${{ secrets.ECS_PASSWORD }}
        source: "build/libs/report-system-0.0.1-SNAPSHOT.jar"
        # Upload to tmp first to avoid permission issues
        target: "/tmp/"
        strip_components: 2

    - name: Restart Application via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.ECS_HOST }}
        username: ${{ secrets.ECS_USERNAME }}
        password: ${{ secrets.ECS_PASSWORD }}
        command_timeout: 5m
        script: |
          # 0. Provision and verify the headless PDF runtime before touching the running service.
          install_rpm_pdf_runtime() {
            package_manager="$1"

            if ! sudo "$package_manager" install -y libreoffice-headless libreoffice-writer fontconfig; then
              if ! sudo "$package_manager" install -y libreoffice-writer fontconfig; then
                sudo "$package_manager" install -y libreoffice fontconfig
              fi
            fi

            sudo "$package_manager" install -y google-noto-serif-cjk-fonts \
              || sudo "$package_manager" install -y google-noto-serif-cjk-ttc-fonts \
              || echo "Serif CJK Noto font package not available from $package_manager; continuing with installed fonts."

            sudo "$package_manager" install -y google-noto-cjk-fonts \
              || sudo "$package_manager" install -y google-noto-sans-cjk-fonts \
              || sudo "$package_manager" install -y google-noto-sans-cjk-ttc-fonts \
              || echo "CJK Noto font package not available from $package_manager; continuing with installed fonts."

            sudo "$package_manager" install -y google-noto-color-emoji-fonts \
              || sudo "$package_manager" install -y google-noto-emoji-color-fonts \
              || echo "Color emoji font package not available from $package_manager; continuing with installed fonts."
          }

          PDF_EXECUTABLE="$(command -v libreoffice || command -v soffice || true)"
          if [ -z "$PDF_EXECUTABLE" ]; then
            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update
              sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
                libreoffice-writer fonts-noto-cjk fonts-noto-serif-cjk fonts-noto-color-emoji fontconfig
            elif command -v dnf >/dev/null 2>&1; then
              install_rpm_pdf_runtime dnf
            elif command -v yum >/dev/null 2>&1; then
              install_rpm_pdf_runtime yum
            else
              echo "No supported package manager found for LibreOffice PDF runtime." >&2
              exit 1
            fi
            PDF_EXECUTABLE="$(command -v libreoffice || command -v soffice || true)"
          fi

          if [ -z "$PDF_EXECUTABLE" ]; then
            echo "LibreOffice installation completed without an executable on PATH." >&2
            exit 1
          fi
          sudo mkdir -p /etc/fonts/conf.d
          sudo tee /etc/fonts/conf.d/30-report-system-fonts.conf > /dev/null <<'FONTCONF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
          <fontconfig>
            <alias binding="strong">
              <family>华文宋体</family>
              <prefer>
                <family>Noto Serif CJK SC</family>
                <family>Noto Serif CJK JP</family>
                <family>Noto Serif CJK</family>
              </prefer>
            </alias>
            <alias binding="strong">
              <family>STSong</family>
              <prefer>
                <family>Noto Serif CJK SC</family>
                <family>Noto Serif CJK JP</family>
                <family>Noto Serif CJK</family>
              </prefer>
            </alias>
            <alias binding="strong">
              <family>Songti SC</family>
              <prefer>
                <family>Noto Serif CJK SC</family>
                <family>Noto Serif CJK JP</family>
                <family>Noto Serif CJK</family>
              </prefer>
            </alias>
          </fontconfig>
          FONTCONF
          fc-cache -f
          "$PDF_EXECUTABLE" --headless --version

          # 1. Move file to target location
          sudo mv /tmp/report-system-0.0.1-SNAPSHOT.jar /opt/
          sudo chown root:root /opt/report-system-0.0.1-SNAPSHOT.jar

          # 2. Check and Create Service File (overwrite with sudo to handle permissions)
          sudo tee /etc/systemd/system/report-system.service > /dev/null <<EOF
          [Unit]
          Description=Report System
          After=network.target

          [Service]
          Type=simple
          # Full path to java with memory limits
          Environment=REPORT_PDF_ENABLED=true
          Environment=REPORT_PDF_EXECUTABLE=$PDF_EXECUTABLE
          Environment=REPORT_PDF_TIMEOUT_SECONDS=120
          Environment=REPORT_PDF_MAX_CONCURRENT=1
          ExecStart=/usr/bin/java -Xmx512M -Xms512M -jar /opt/report-system-0.0.1-SNAPSHOT.jar
          WorkingDirectory=/opt
          Restart=on-failure
          User=root

          [Install]
          WantedBy=multi-user.target
          EOF

          # 3. Reload and Restart
          echo "Reloading systemd and restarting service..."
          sudo systemctl daemon-reload
          sudo systemctl enable report-system
          sudo systemctl restart report-system
          
          # 4. Verify Service Status
          sleep 3
          systemctl is-active report-system
